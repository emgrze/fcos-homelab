apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: apps
data:
  settings.yaml: |
    title: FCOS-AI-homelab
    theme: dark
    color: slate
    background:
     image: https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=2560&q=80
     blur: sm
     saturate: 30
     brightness: 50
     opacity: 40
    cardBlur: sm
    headerStyle: clean
    layout:
      Infrastructure:
#        style: row
#        columns: 3
      Services:
#        style: row
#        columns: 3

  services.yaml: |
    - Infrastructure:
        - ArgoCD:
            href: http://192.168.1.10:30xxx
            description: GitOps continuous delivery
            icon: argo-cd.png
        - Pi-hole:
            href: http://192.168.1.10:8080/admin
            description: Network-wide ad blocking & DNS
            icon: pi-hole.png
            widget:
              type: pihole
              url: http://pihole.apps.svc.cluster.local:8080
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_API_KEY}}"

    - Services:
        - llama.cpp:
            href: http://ai.home
            description: Local LLM inference (iGPU-accelerated)
            icon: ollama.png
        - podinfo:
            href: http://192.168.1.10:9898
            description: GitOps demo / test app
            icon: si-cloudsmith

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /

  bookmarks.yaml: |
    - Developer:
        - GitHub Repo:
            - abbr: GH
              href: https://github.com/emgrze/fcos-homelab
