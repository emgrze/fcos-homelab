apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: apps
data:
  settings.yaml: |
    title: Homelab Panel
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Infrastructure:
        style: row
        columns: 3
      Services:
        style: row
        columns: 3

  services.yaml: |
    - Infrastructure:
        - ArgoCD:
            href: http://192.168.1.10:30xxx
            description: GitOps continuous delivery
            icon: argocd.png
        - Pi-hole:
            href: http://192.168.1.10:8080/admin
            description: Network-wide ad blocking & DNS
            icon: pihole.png
            widget:
              type: pihole
              url: http://pihole.apps.svc.cluster.local
              key: {{HOMEPAGE_VAR_PIHOLE_API_KEY}}

    - Services:
        - llama.cpp:
            href: http://ai.home
            description: Local LLM inference (Gemma 4 E2B, GPU-accelerated)
            icon: ollama.png
        - podinfo:
            href: http://192.168.1.10:9898
            description: GitOps demo / test app
            icon: si-cloudsmith

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /

  bookmarks.yaml: |
    - Developer:
        - GitHub Repo:
            - abbr: GH
              href: https://github.com/emgrze/fcos-homelab
