apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  namespace: apps
  labels:
    app: llamacpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llamacpp
  template:
    metadata:
      labels:
        app: llamacpp
    spec:
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              rm -f /models/model.gguf
              echo "Downloading LLM..."
              curl -L -o /models/model.gguf \
                "https://huggingface.co/HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive/resolve/main/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf"
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/kth8/llama-server-vulkan:latest
          env:
            - name: LLAMA_ARG_MODEL
              value: "/models/model.gguf"
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              value: "8080"
            - name: LLAMA_ARG_N_GPU_LAYERS
              value: "999"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 10Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llamacpp-models
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
