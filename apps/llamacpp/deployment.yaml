apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  namespace: apps
  labels:
    app: llamacpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llamacpp
  template:
    metadata:
      labels:
        app: llamacpp
    spec:
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.10.1
          env:
            - name: MODEL_URL
              value: "https://huggingface.co/yuxinlu1/gemma-4-12B-coder-fable5-composer2.5-v1-GGUF/resolve/main/gemma4-coding-Q4_K_M.gguf"
          command:
            - sh
            - -c
            - |
              MIN_SIZE=1000000000
              if [ -f /models/model.gguf ]; then
                ACTUAL_SIZE=$(stat -c%s /models/model.gguf 2>/dev/null || echo 0)
                if [ "$ACTUAL_SIZE" -lt "$MIN_SIZE" ]; then
                  echo "Existing file too small, removing."
                  rm -f /models/model.gguf
                fi
              fi

              FILENAME=$(basename "$MODEL_URL")
              ALIAS=$(echo "$FILENAME" | sed -E 's/\.gguf$//; s/[-_]/ /g')
              echo "$ALIAS" > /models/alias.txt
              echo "Derived alias: $ALIAS"

              rm -f /models/model.gguf
              echo "Downloading from $MODEL_URL..."
              curl -L --fail -o /models/model.gguf.tmp "$MODEL_URL"
              mv /models/model.gguf.tmp /models/model.gguf
              echo "Download complete."
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/kth8/llama-server-vulkan:latest
          command:
            - sh
            - -c
            - |
              export LLAMA_ARG_ALIAS="$(cat /models/alias.txt 2>/dev/null || echo 'Unknown Model')"
              echo "Starting with alias: $LLAMA_ARG_ALIAS"
              exec /llama-server
          env:
            - name: LLAMA_ARG_MODEL
              value: "/models/model.gguf"
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              value: "8080"
            - name: LLAMA_ARG_N_GPU_LAYERS
              value: "999"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 10Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llamacpp-models
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
