apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llamacpp
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: llamacpp=ghcr.io/kth8/llama-server-vulkan:latest
    argocd-image-updater.argoproj.io/llamacpp.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/emgrze/fcos-homelab.git
    targetRevision: main
    path: apps/llamacpp
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
