apiVersion: argoproj.io/v1alpha1
metadata:
  name: pihole
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: pihole=pihole/pihole
    argocd-image-updater.argoproj.io/pihole.update-strategy: semver
    argocd-image-updater.argoproj.io/pihole.allow-tags: "regexp:^2026\\."
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/emgrze/fcos-homelab.git
    targetRevision: main
    path: apps/pihole
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
